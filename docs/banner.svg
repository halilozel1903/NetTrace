<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="NetTrace: in-app network inspector for iOS" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="1" stop-color="#101a3a"/>
    </linearGradient>
    <radialGradient id="blob1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>
  <circle cx="900" cy="140" r="240" fill="url(#blob1)" filter="url(#blur)"/>
  <circle cx="1150" cy="460" r="220" fill="url(#blob2)" filter="url(#blur)"/>

  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="235" fill="#ffffff" font-size="76" font-weight="800" letter-spacing="-2">NetTrace</text>
    <text x="82" y="290" fill="#cbd5e1" font-size="28" font-weight="500">In-app network inspector for iOS</text>
    <g font-size="20" font-weight="600">
      <rect x="82" y="330" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="157" y="357" fill="#e2e8f0" text-anchor="middle">URLSession</text>
      <rect x="244" y="330" width="96" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="292" y="357" fill="#e2e8f0" text-anchor="middle">cURL</text>
      <rect x="352" y="330" width="110" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="407" y="357" fill="#e2e8f0" text-anchor="middle">Swift 6</text>
      <rect x="474" y="330" width="80" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="514" y="357" fill="#e2e8f0" text-anchor="middle">SPM</text>
    </g>

    <!-- Request list card -->
    <g filter="url(#shadow)">
      <rect x="690" y="70" width="500" height="420" rx="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
    </g>
    <text x="722" y="122" fill="#ffffff" font-size="28" font-weight="700">Network</text>
    <g font-size="15" font-weight="700" text-anchor="middle">
      <rect x="1052" y="100" width="108" height="30" rx="15" fill="#ffffff" fill-opacity="0.12"/>
      <text x="1106" y="120" fill="#e2e8f0">14 requests</text>
    </g>

    <g font-size="18">
      <!-- Row 1 -->
      <rect x="722" y="152" width="70" height="28" rx="14" fill="#3b82f6" fill-opacity="0.25"/>
      <text x="757" y="172" fill="#93c5fd" font-size="14" font-weight="800" text-anchor="middle" font-family="Menlo, monospace">GET</text>
      <text x="808" y="166" fill="#ffffff" font-weight="600">/v2/products/8841</text>
      <text x="808" y="188" fill="#94a3b8" font-size="14">api.example.com · 88 ms · 1.1 KB</text>
      <rect x="1098" y="150" width="62" height="28" rx="14" fill="#22c55e" fill-opacity="0.25"/>
      <text x="1129" y="170" fill="#86efac" font-size="15" font-weight="800" text-anchor="middle">200</text>
      <line x1="722" y1="208" x2="1160" y2="208" stroke="#ffffff" stroke-opacity="0.12"/>

      <!-- Row 2 -->
      <rect x="722" y="226" width="70" height="28" rx="14" fill="#22c55e" fill-opacity="0.25"/>
      <text x="757" y="246" fill="#86efac" font-size="14" font-weight="800" text-anchor="middle" font-family="Menlo, monospace">POST</text>
      <text x="808" y="240" fill="#ffffff" font-weight="600">/v2/cart/items</text>
      <text x="808" y="262" fill="#94a3b8" font-size="14">api.example.com · 211 ms · 84 B</text>
      <rect x="1098" y="224" width="62" height="28" rx="14" fill="#22c55e" fill-opacity="0.25"/>
      <text x="1129" y="244" fill="#86efac" font-size="15" font-weight="800" text-anchor="middle">201</text>
      <line x1="722" y1="282" x2="1160" y2="282" stroke="#ffffff" stroke-opacity="0.12"/>

      <!-- Row 3 -->
      <rect x="722" y="300" width="70" height="28" rx="14" fill="#3b82f6" fill-opacity="0.25"/>
      <text x="757" y="320" fill="#93c5fd" font-size="14" font-weight="800" text-anchor="middle" font-family="Menlo, monospace">GET</text>
      <text x="808" y="314" fill="#ffffff" font-weight="600">/v2/promotions/summer-sale</text>
      <text x="808" y="336" fill="#94a3b8" font-size="14">api.example.com · 71 ms · 79 B</text>
      <rect x="1098" y="298" width="62" height="28" rx="14" fill="#f97316" fill-opacity="0.28"/>
      <text x="1129" y="318" fill="#fdba74" font-size="15" font-weight="800" text-anchor="middle">404</text>
      <line x1="722" y1="356" x2="1160" y2="356" stroke="#ffffff" stroke-opacity="0.12"/>

      <!-- Row 4 -->
      <rect x="722" y="374" width="70" height="28" rx="14" fill="#22c55e" fill-opacity="0.25"/>
      <text x="757" y="394" fill="#86efac" font-size="14" font-weight="800" text-anchor="middle" font-family="Menlo, monospace">POST</text>
      <text x="808" y="388" fill="#ffffff" font-weight="600">/v2/checkout</text>
      <text x="808" y="410" fill="#94a3b8" font-size="14">api.example.com · 1.28 s · 83 B</text>
      <rect x="1098" y="372" width="62" height="28" rx="14" fill="#ef4444" fill-opacity="0.3"/>
      <text x="1129" y="392" fill="#fca5a5" font-size="15" font-weight="800" text-anchor="middle">500</text>
    </g>

    <!-- cURL line -->
    <rect x="722" y="430" width="438" height="36" rx="12" fill="#000000" fill-opacity="0.35"/>
    <text x="738" y="454" fill="#5eead4" font-size="15" font-family="Menlo, monospace">$ curl -X POST 'https://api.example…'</text>
  </g>
</svg>
